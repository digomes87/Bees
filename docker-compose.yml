services:
  # docker compose run --rm analysis all
  analysis:
    build: .
    volumes:
      - ./data:/work/data
      - ./results:/work/results
      - ./images:/work/images

  # docker compose up site  ->  http://127.0.0.1:8000
  site:
    build: .
    entrypoint: ["python", "-m", "http.server", "8000", "--directory", "/app/docs"]
    command: []
    ports:
      - "127.0.0.1:8000:8000"
