[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-migration-analysis"
version = "1.0.0"
authors = [{ name = "Diego Gomes", email = "diego@example.com" }]
description = "Climate impact assessment on bee migration patterns in South America"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bees", "migration", "climate", "analysis", "machine-learning"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=4.0"]
notebook = ["jupyterlab>=4.0"]

[project.urls]
Homepage = "https://github.com/digomes87/Bees"
Issues = "https://github.com/digomes87/Bees/issues"

[project.scripts]
bee-migration = "bee_migration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=bee_migration --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
